name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static prerender)
        env:
          NITRO_PRESET: static
        run: bun run build

      - name: Prepare Pages output
        run: |
          OUT_DIR=""
          for candidate in .output/public dist/client dist; do
            if [ -d "$candidate" ]; then OUT_DIR="$candidate"; break; fi
          done
          if [ -z "$OUT_DIR" ]; then
            echo "No build output directory found" >&2
            exit 1
          fi
          echo "Using $OUT_DIR"
          touch "$OUT_DIR/.nojekyll"
          # SPA fallback so client-side routes work on refresh
          if [ -f "$OUT_DIR/index.html" ] && [ ! -f "$OUT_DIR/404.html" ]; then
            cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          fi
          echo "PAGES_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4